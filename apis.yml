image: https://risepoint.com/wp-content/uploads/2024/09/image-3.jpg

description: 'Academic Partnerships, now operating as Risepoint, was founded in 2007 to expand access to workforce‑focused education for working adults. Originating from a response to Hurricane Rita’s impact on Texas public universities, the company developed an online education model that improves student outcomes and scales efficiently. Over nearly two decades, Risepoint has partnered with numerous public institutions to deliver flexible, high‑quality learning experiences, aiming to broaden higher‑education accessibility.'

